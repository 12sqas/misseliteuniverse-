<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>National Director Application | Miss Elite Universe 2027</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050505;color:#fff;font-family:Arial,sans-serif}
.wrap{max-width:900px;margin:auto;padding:35px 18px 60px}.brand{text-align:center;color:#d4af37;letter-spacing:2px;font-family:Georgia,serif}
h1{text-align:center;color:#d4af37;font:34px Georgia,serif;margin:12px 0}.sub{text-align:center;color:#ddd;margin-bottom:30px}
.card{background:#111;border:1px solid #6f5720;border-radius:14px;padding:28px}
label{display:block;margin:15px 0 7px;color:#e6c766;font-weight:600}
input,textarea{width:100%;padding:13px;border-radius:7px;border:1px solid #555;background:#080808;color:#fff;font-size:15px}
textarea{min-height:120px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}.full{grid-column:1/-1}
button{margin-top:24px;width:100%;padding:15px;border:0;border-radius:8px;background:#d4af37;color:#080808;font-size:17px;font-weight:700}
.note{text-align:center;color:#aaa;font-size:13px;margin-top:18px;line-height:1.6}
@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}h1{font-size:27px}}
</style></head><body>
<div class="wrap">
<div class="brand">MISS ELITE UNIVERSE 2027 • THAILAND</div>
<h1>NATIONAL DIRECTOR APPLICATION</h1>
<div class="sub">Official Expression of Interest — Season 2027</div>
<div class="card">
<form action="https://formsubmit.co/eliteuniversemiss@gmail.com" method="POST">
<input type="hidden" name="_subject" value="National Director Application — Miss Elite Universe 2027">
<input type="hidden" name="_template" value="table">
<input type="hidden" name="_captcha" value="true">
<input type="hidden" name="_next" value="https://www.misseliteuniverse.org/national-director-thank-you.html">
<div class="grid">
<div><label>Full Name *</label><input type="text" name="Full Name" required></div>
<div><label>Country / Territory *</label><input type="text" name="Country / Territory" required></div>
<div><label>Email Address *</label><input type="email" name="Email Address" required></div>
<div><label>Phone / WhatsApp *</label><input type="text" name="Phone / WhatsApp" required></div>
<div><label>Organization / Company</label><input type="text" name="Organization / Company"></div>
<div><label>Position / Title</label><input type="text" name="Position / Title"></div>
<div class="full"><label>Official Website / Social Media</label><input type="text" name="Official Website / Social Media"></div>
<div class="full"><label>Beauty Pageant / National Director Experience</label><textarea name="Experience"></textarea></div>
<div class="full"><label>Why would you like to become a National Director for Miss Elite Universe?</label><textarea name="Motivation"></textarea></div>
<div class="full"><label>Additional Information</label><textarea name="Additional Information"></textarea></div>
</div>
<button type="submit">SUBMIT NATIONAL DIRECTOR APPLICATION</button>
<div class="note">Your application will be forwarded to the official Miss Elite Universe organization for review.<br>Official website: misseliteuniverse.org</div>
</form></div></div></body></html>
