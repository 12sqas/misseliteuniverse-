name: Import Miss Elite Universe Thailand 2027 homepage banner
on:
  push:
    paths:
      - '.github/workflows/import-thailand-hero.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-banner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the user-provided original banner
        env:
          SOURCE_IMAGE: 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/8abf94a1-b149-4eb9-8851-5a83a0702f0c.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNTM5Zjk2M2E5ZWZlZGVlNCIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NDI3MzIxMH0.DdwppSjkG_nwfBoEYERUoOr8oyEb2__w134Tk4iv8f0'
        run: |
          set -euo pipefail
          mkdir -p images
          curl --fail --location --retry 3 --max-time 100 "$SOURCE_IMAGE" --output images/meu-thailand-2027-hero.png
          test "$(wc -c < images/meu-thailand-2027-hero.png)" -gt 150000
          file images/meu-thailand-2027-hero.png | grep -q 'PNG image data'
          echo "Saved banner size: $(wc -c < images/meu-thailand-2027-hero.png) bytes"
      - name: Commit the downloaded banner permanently to the website
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/meu-thailand-2027-hero.png
          if ! git diff --cached --quiet; then
            git commit -m "Publish official Thailand 2027 hero banner image"
            git push
          fi
