name: Import MEU official 2027 schedule artwork
on:
  push:
    paths:
      - .github/workflows/import-meu-2027-schedule.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-artwork:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download and validate official artwork
        env:
          IMAGE_URL: 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/0fca677f-5012-43ff-a93b-eb96a0c293fe.jpg?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNTMwMmZmOGJlNmZhMGRiYyIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NDI5MjYxOX0.RvHB3k97eTkkMSLOzwMIpuJqk1pg8AFsp5UzdA8H-wk'
        run: |
          set -euo pipefail
          mkdir -p images
          curl --fail --location --retry 3 --silent --show-error "$IMAGE_URL" --output images/meu-official-schedule-2027.jpg
          file --mime-type images/meu-official-schedule-2027.jpg
          test "$(file -b --mime-type images/meu-official-schedule-2027.jpg)" = image/jpeg
          test "$(wc -c < images/meu-official-schedule-2027.jpg)" -gt 250000
      - name: Commit the original schedule artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/meu-official-schedule-2027.jpg
          git diff --cached --quiet && exit 0
          git commit -m "Add official Miss Elite Universe 2027 schedule poster"
          git push
